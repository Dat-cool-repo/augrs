name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NO_ALBUMENTATIONS_UPDATE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6  # PyO3's build script wants an interpreter for clippy on augrs-py
        with:
          python-version: "3.12"
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: tests (unit + property)
        run: cargo test -p augrs-core --release -- --test-threads=4
      - name: tests on the portable scalar kernels (what ARM / pre-AVX2 CPUs run)
        if: runner.os == 'Linux'
        run: cargo test -p augrs-core --release -- --test-threads=4
        env:
          AUGRS_FORCE_SCALAR: "1"

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -m crates/augrs-py/Cargo.toml --out dist
      - name: install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pip install numpy pytest pyyaml "albumentations==2.0.8" opencv-python-headless
          python -c "import cv2, platform; print('OpenCV', cv2.__version__, 'on', platform.machine())"
      - name: smoke test (installed wheel)
        working-directory: dist
        run: python ../scripts/smoke_test.py
      - name: pytest (parity with Albumentations 2.0.8 / OpenCV, API, serialisation)
        run: python -m pytest compat-tests -q -p no:cacheprovider
      - name: pytest on the portable scalar kernels (what arm / pre-AVX2 CPUs run)
        if: runner.os == 'Linux'
        run: python -m pytest compat-tests -q -p no:cacheprovider
        env:
          AUGRS_FORCE_SCALAR: "1"
