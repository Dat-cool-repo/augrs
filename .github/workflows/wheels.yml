name: Wheels

# Builds abi3 wheels (one per platform, Python >= 3.9) and an sdist, and uploads them as
# workflow artifacts. On a `v*` tag, once the builds and checks have passed, the `publish` job
# uploads them to PyPI as `augrs-py` with trusted publishing (OIDC, no API token).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  NO_ALBUMENTATIONS_UPDATE: "1"

jobs:
  wheels:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: windows-x86_64, runner: windows-latest, target: x64, manylinux: "" }
          # Intel macOS runner label; adjust if GitHub retires it
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: "" }
          - { name: macos-arm64, runner: macos-14, target: aarch64, manylinux: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out ${{ github.workspace }}/dist
          sccache: "true"
      - name: test the wheel on the build machine
        shell: bash
        run: |
          python -m pip install dist/*.whl numpy pytest pyyaml "albumentations==2.0.8" opencv-python-headless
          (cd dist && python ../scripts/smoke_test.py)
          python -m pytest compat-tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ${{ github.workspace }}/dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  check:
    name: check distributions
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: twine check and contents (licenses, notices, metadata)
        run: |
          python -m pip install --upgrade twine
          ls -la dist
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist/*
      - name: build and install from the sdist in a fresh venv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz pyyaml
          cd /tmp && /tmp/sdist-venv/bin/python "$GITHUB_WORKSPACE/scripts/smoke_test.py"

  publish:
    name: publish to PyPI
    needs: [wheels, sdist, check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/augrs-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist
      - name: tag matches the package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls -la dist
          for f in dist/*; do
            case "$(basename "$f")" in
              augrs_py-"$v"-*|augrs_py-"$v".tar.gz) ;;
              *) echo "::error::$f does not match augrs_py-$v"; exit 1 ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
