[workspace]
resolver = "3"
members = ["crates/augrs-core", "crates/augrs-py"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Dat-cool-repo contributors"]
repository = "https://github.com/Dat-cool-repo/augrs"
homepage = "https://github.com/Dat-cool-repo/augrs"
rust-version = "1.85"

[workspace.dependencies]
ndarray = "0.17"
fast_image_resize = "6.1"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats exactly (Python sends its parameters as JSON)
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
