__version__: 2.0.8
transform:
  __class_fullname__: Compose
  additional_targets: {}
  bbox_params:
    check_each_transform: true
    clip: true
    format: coco
    label_fields:
    - labels
    max_accept_ratio: null
    min_area: 0.0
    min_height: 0.0
    min_visibility: 0.1
    min_width: 0.0
  is_check_shapes: true
  keypoint_params: null
  p: 1.0
  transforms:
  - __class_fullname__: RandomResizedCrop
    area_for_downscale: null
    interpolation: 1
    mask_interpolation: 0
    p: 1.0
    ratio:
    - 0.75
    - 1.3333333333333333
    scale:
    - 0.25
    - 1.0
    size:
    - 512
    - 512
  - __class_fullname__: HorizontalFlip
    p: 0.5
  - __class_fullname__: Affine
    balanced_scale: false
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    fit_output: false
    interpolation: 1
    keep_ratio: false
    mask_interpolation: 0
    p: 0.5
    rotate:
    - -15.0
    - 15.0
    rotate_method: largest_box
    scale:
      x:
      - 0.9
      - 1.1
      y:
      - 0.9
      - 1.1
    shear:
      x:
      - 0.0
      - 0.0
      y:
      - 0.0
      - 0.0
    translate_percent:
      x:
      - -0.0625
      - 0.0625
      y:
      - -0.0625
      - 0.0625
    translate_px: null
  - __class_fullname__: OneOf
    p: 0.8
    transforms:
    - __class_fullname__: RandomBrightnessContrast
      brightness_by_max: true
      brightness_limit:
      - -0.2
      - 0.2
      contrast_limit:
      - -0.2
      - 0.2
      ensure_safe_range: false
      p: 1.0
    - __class_fullname__: HueSaturationValue
      hue_shift_limit:
      - -20.0
      - 20.0
      p: 1.0
      sat_shift_limit:
      - -30.0
      - 30.0
      val_shift_limit:
      - -20.0
      - 20.0
    - __class_fullname__: RandomGamma
      gamma_limit:
      - 80.0
      - 120.0
      p: 1.0
  - __class_fullname__: ColorJitter
    brightness:
    - 0.8
    - 1.2
    contrast:
    - 0.8
    - 1.2
    hue:
    - -0.05
    - 0.05
    p: 0.5
    saturation:
    - 0.8
    - 1.2
  - __class_fullname__: SomeOf
    n: 2
    p: 0.3
    replace: false
    transforms:
    - __class_fullname__: GaussianBlur
      blur_limit:
      - 3
      - 5
      p: 1.0
      sigma_limit:
      - 0.5
      - 3.0
    - __class_fullname__: GaussNoise
      mean_range:
      - 0.0
      - 0.0
      noise_scale_factor: 1.0
      p: 1.0
      per_channel: true
      std_range:
      - 0.2
      - 0.44
    - __class_fullname__: CLAHE
      clip_limit:
      - 1.0
      - 4.0
      p: 1.0
      tile_grid_size:
      - 8
      - 8
  - __class_fullname__: CoarseDropout
    fill: 0.0
    fill_mask: null
    hole_height_range:
    - 0.05
    - 0.15
    hole_width_range:
    - 0.05
    - 0.15
    num_holes_range:
    - 1
    - 4
    p: 0.3
  - __class_fullname__: ToGray
    method: weighted_average
    num_output_channels: 3
    p: 0.05
  - __class_fullname__: Normalize
    max_pixel_value: 255.0
    mean:
    - 0.485
    - 0.456
    - 0.406
    normalization: standard
    p: 1.0
    std:
    - 0.229
    - 0.224
    - 0.225
