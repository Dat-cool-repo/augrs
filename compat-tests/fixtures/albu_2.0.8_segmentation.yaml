__version__: 2.0.8
transform:
  __class_fullname__: Compose
  additional_targets:
    image2: image
    mask2: mask
  bbox_params: null
  is_check_shapes: true
  keypoint_params: null
  p: 1.0
  transforms:
  - __class_fullname__: LongestMaxSize
    area_for_downscale: null
    interpolation: 1
    mask_interpolation: 0
    max_size: 640
    max_size_hw: null
    p: 1.0
  - __class_fullname__: PadIfNeeded
    border_mode: 0
    fill: 0.0
    fill_mask: 255.0
    min_height: 640
    min_width: 640
    p: 1.0
    pad_height_divisor: null
    pad_width_divisor: null
    padding: 0
    position: center
  - __class_fullname__: RandomCrop
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    height: 512
    p: 1.0
    pad_if_needed: false
    pad_position: center
    width: 512
  - __class_fullname__: Sequential
    p: 0.5
    transforms:
    - __class_fullname__: RandomRotate90
      p: 1.0
    - __class_fullname__: Transpose
      p: 0.5
  - __class_fullname__: VerticalFlip
    p: 0.5
  - __class_fullname__: ShiftScaleRotate
    border_mode: 4
    fill: 0.0
    fill_mask: 0.0
    interpolation: 1
    mask_interpolation: 0
    p: 0.5
    rotate_limit:
    - -20.0
    - 20.0
    rotate_method: largest_box
    scale_limit:
    - -0.09999999999999998
    - 0.10000000000000009
    shift_limit_x:
    - -0.05
    - 0.05
    shift_limit_y:
    - -0.05
    - 0.05
  - __class_fullname__: Perspective
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    fit_output: false
    interpolation: 1
    keep_size: true
    mask_interpolation: 0
    p: 0.3
    scale:
    - 0.05
    - 0.1
  - __class_fullname__: ElasticTransform
    alpha: 40.0
    approximate: false
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    interpolation: 1
    keypoint_remapping_method: mask
    mask_interpolation: 0
    noise_distribution: gaussian
    p: 0.2
    same_dxdy: false
    sigma: 6.0
  - __class_fullname__: Rotate
    border_mode: 0
    crop_border: false
    fill: 0.0
    fill_mask: 0.0
    interpolation: 1
    limit:
    - -10.0
    - 10.0
    mask_interpolation: 0
    p: 0.3
    rotate_method: largest_box
  - __class_fullname__: Resize
    area_for_downscale: null
    height: 256
    interpolation: 1
    mask_interpolation: 0
    p: 1.0
    width: 256
  - __class_fullname__: CenterCrop
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    height: 224
    p: 1.0
    pad_if_needed: false
    pad_position: center
    width: 224
  - __class_fullname__: SmallestMaxSize
    area_for_downscale: null
    interpolation: 1
    mask_interpolation: 0
    max_size: 224
    max_size_hw: null
    p: 1.0
  - __class_fullname__: Normalize
    max_pixel_value: 255.0
    mean: 0.5
    normalization: standard
    p: 1.0
    std: 0.25
