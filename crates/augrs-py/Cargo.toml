[package]
name = "augrs-py"
description = "Python bindings (PyO3) for augrs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_augrs"
crate-type = ["cdylib"]

[dependencies]
augrs-core = { path = "../augrs-core" }
pyo3 = { version = "0.29", features = ["abi3-py39", "generate-import-lib"] }
numpy = "0.29"
ndarray = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
extension-module = ["pyo3/extension-module"]
# mimalloc keeps freed image buffers for reuse; glibc returns large blocks to the OS
# (munmap) and every new 1-3 MB buffer then page-faults again.
mimalloc = ["dep:mimalloc"]
default = ["extension-module", "mimalloc"]
